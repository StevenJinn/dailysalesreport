<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PF Sales Report Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Thai:wght@400;500;600;700;800&family=Sarabun:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@500;600&family=Mitr:wght@400;500;600;700&family=Baloo+2:wght@700;800&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#ffffff;
    --paper-2:#f4f4f4;
    --ink:#1b1c19;
    --ink-dim:#726c5c;
    --rule:#dcdcdc;
    --stamp:#b3311f;
    --stamp-dim:#8f4636;
    --pos:#2f6b45;
    --neg:#b3311f;
    --warn:#9a6b12;
    --warn-bg:#fbf1de;
    --fix-bg:#fbeae7;
    --card:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;min-height:100vh;
    background:
      radial-gradient(circle at 18% 0%, rgba(63,92,76,.45), transparent 42%),
      radial-gradient(circle at 85% -10%, rgba(179,49,31,.18), transparent 38%),
      var(--paper);
    color:var(--ink);
    font-family:'Inter','Noto Sans Thai',ui-sans-serif,system-ui,sans-serif;
  }
  .store-bar{
    background:rgba(23,21,22,.55);
    -webkit-backdrop-filter:blur(18px) saturate(140%);
    backdrop-filter:blur(18px) saturate(140%);
    padding:16px 22px;
    display:flex;align-items:center;gap:18px;flex-wrap:nowrap;
    border-bottom:1px solid rgba(255,255,255,.14);
    box-shadow:0 8px 24px rgba(0,0,0,.15);
  }
  .store-bar-text{
    display:flex;flex-direction:column;gap:5px;
    min-width:0;flex:1;
  }
  .store-bar img{
    display:block;margin:0;width:84px;height:84px;flex-shrink:0;
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 20px 80px;}
  header{margin-bottom:32px;}
  .eyebrow{
    font-family:'Baloo 2',sans-serif;font-weight:800;
    font-size:clamp(13px, 4vw, 18px);letter-spacing:.01em;text-transform:none;
    color:#e4e2da;margin-top:0;
  }
  .eyebrow .big-letter{
    font-size:clamp(17px, 5vw, 23px);font-weight:800;
  }
  .eyebrow .brand-name{
    letter-spacing:.02em;
  }
  .eyebrow .dot{
    color:#8fbfa0;margin:0 clamp(3px,1.2vw,10px);
  }
  .eyebrow .tag{
    font-size:clamp(13px, 4vw, 18px);letter-spacing:.02em;text-transform:uppercase;
    font-weight:700;color:#9aa39c;
  }
  h1{
    margin:0;line-height:0;
  }
  h1 svg{
    display:block;height:44px;width:auto;max-width:100%;
  }
  .sub{color:var(--ink-dim);font-size:14px;line-height:1.7;max-width:54ch;margin-top:18px;}

  .drop{
    margin-top:32px;
    border:1.5px solid var(--ink);
    border-radius:2px;
    background:var(--card);
    padding:26px;
    position:relative;
    box-shadow:4px 4px 0 var(--rule);
    transition:border-color .2s ease, box-shadow .2s ease, transform .12s ease;
  }
  .drop.drag{
    border-color:var(--stamp);box-shadow:4px 4px 0 var(--stamp-dim);
    transform:translate(-1px,-1px) scale(1.012);
  }
  .drop.pop{animation:dropPop .38s cubic-bezier(.34,1.56,.64,1);}
  .drop-inner{
    display:flex;flex-direction:column;align-items:center;text-align:center;
    gap:10px;padding:26px 10px;border:1px dashed var(--rule);border-radius:2px;
    cursor:pointer;position:relative;overflow:hidden;
    transition:border-color .2s ease, background-color .2s ease;
  }
  .drop-inner:hover{border-color:var(--ink);}
  .drop.drag .drop-inner{
    border-color:var(--stamp);
    background-image:repeating-linear-gradient(90deg, var(--stamp) 0 10px, transparent 10px 20px);
    background-size:200% 1.5px;
    background-repeat:no-repeat;
    background-position:0 0, 0 100%;
    animation:marchAnts .6s linear infinite;
  }
  .drop.drag .drop-inner::before{
    content:'';position:absolute;inset:0;
    background:radial-gradient(circle at 50% 40%, rgba(179,49,31,.08), transparent 70%);
    pointer-events:none;
  }
  .stamp-icon{
    display:flex;align-items:center;justify-content:center;
    transition:transform .2s ease;
  }
  .stamp-icon img{
    display:block;width:auto;height:34px;
    transition:transform .2s ease;
  }
  .drop.drag .stamp-icon img{animation:iconBounce .55s ease-in-out infinite;}
  .stamp-icon.success img{animation:iconLand .45s cubic-bezier(.34,1.56,.64,1);}
  .drop-title{font-size:15px;color:var(--ink);font-weight:500;transition:color .15s ease;}
  .drop.drag .drop-title{color:var(--stamp-dim);}
  .drop-hint{font-size:12px;color:var(--ink-dim);}
  input[type=file]{display:none;}

  @keyframes marchAnts{
    from{background-position:0 0, 0 100%;}
    to{background-position:-20px 0, 20px 100%;}
  }
  @keyframes iconBounce{
    0%,100%{transform:translateY(0) scale(1);}
    50%{transform:translateY(-7px) scale(1.06);}
  }
  @keyframes iconLand{
    0%{transform:translateY(-14px) scale(.85);opacity:.4;}
    60%{transform:translateY(2px) scale(1.08);opacity:1;}
    100%{transform:translateY(0) scale(1);}
  }
  @keyframes dropPop{
    0%{transform:scale(1);}
    35%{transform:scale(1.015);}
    100%{transform:scale(1);}
  }
  @keyframes filebarIn{
    from{opacity:0;transform:translateY(-4px);}
    to{opacity:1;transform:translateY(0);}
  }
  @keyframes outputIn{
    from{opacity:0;transform:translateY(6px);}
    to{opacity:1;transform:translateY(0);}
  }

  .filebar{
    margin-top:14px;display:flex;align-items:center;justify-content:space-between;
    font-size:12.5px;color:var(--ink-dim);
    display:none;
  }
  .filebar.show{display:flex;animation:filebarIn .3s ease both;}
  .filebar b{color:var(--ink);font-weight:600;}
  .filebar button{
    background:none;border:none;color:var(--stamp-dim);cursor:pointer;
    font-family:inherit;font-size:12.5px;text-decoration:underline;
  }

  .historybar{
    margin-top:18px;display:none;
  }
  .historybar.show{display:block;animation:filebarIn .3s ease both;}
  .history-head{
    display:flex;align-items:center;justify-content:space-between;
    font-size:11px;color:var(--ink-dim);margin-bottom:8px;
    text-transform:uppercase;letter-spacing:.08em;font-weight:700;
  }
  .history-head button{
    background:none;border:none;color:var(--stamp-dim);cursor:pointer;
    font-family:inherit;font-size:11.5px;text-decoration:underline;
    text-transform:none;letter-spacing:0;font-weight:500;
  }
  .history-list{
    border:1px solid var(--rule);border-radius:2px;overflow:hidden;
  }
  .history-item{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:9px 12px;border-bottom:1px dashed var(--rule);
    transition:background .12s ease;
  }
  .history-item:last-child{border-bottom:none;}
  .history-item:hover{background:var(--paper-2);}
  .history-info{
    display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;
    cursor:pointer;
  }
  .history-info b{
    font-size:12.5px;color:var(--ink);font-weight:600;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .history-info span{font-size:11px;color:var(--ink-dim);}
  .history-del{
    background:none;border:none;color:var(--neg);cursor:pointer;
    font-family:inherit;font-size:11.5px;text-decoration:underline;
    flex-shrink:0;padding:2px 0;
  }

  .datebar{
    margin-top:18px;display:none;align-items:center;gap:10px;
    font-size:13px;color:var(--ink-dim);
  }
  .datebar.show{display:flex;}

  .sheetnote{
    margin-top:10px;display:none;
    font-size:11.5px;line-height:1.6;color:var(--warn);
    border-left:3px solid var(--warn);background:var(--warn-bg);
    padding:8px 10px;border-radius:2px;
  }
  .sheetnote.show{display:block;animation:filebarIn .3s ease both;}

  .cs{position:relative;flex:1;max-width:280px;}
  .cs-trigger{
    width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--paper);color:var(--ink);border:1px solid var(--ink);
    border-radius:2px;padding:8px 10px;font-family:inherit;font-size:13px;
    cursor:pointer;transition:border-color .15s ease, box-shadow .15s ease;
  }
  .cs-trigger:hover{border-color:var(--stamp-dim);}
  .cs-trigger:focus-visible{outline:none;border-color:var(--stamp);box-shadow:0 0 0 2px rgba(179,49,31,.15);}
  .cs.open .cs-trigger{border-color:var(--stamp);}
  .cs-trigger-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cs-chevron{
    width:10px;height:10px;flex-shrink:0;
    border-right:1.5px solid var(--ink-dim);border-bottom:1.5px solid var(--ink-dim);
    transform:rotate(45deg) translateY(-2px);
    transition:transform .2s ease, border-color .15s ease;
  }
  .cs.open .cs-chevron{transform:rotate(225deg) translateY(-1px);border-color:var(--stamp);}

  .cs-menu{
    position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:20;
    background:var(--paper);border:1px solid var(--ink);border-radius:2px;
    box-shadow:4px 4px 0 var(--rule);
    max-height:240px;overflow-y:auto;
    opacity:0;transform:translateY(-4px) scale(.98);
    pointer-events:none;
    transform-origin:top center;
    transition:opacity .15s ease, transform .15s cubic-bezier(.34,1.56,.64,1);
  }
  .cs.open .cs-menu{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}
  .cs-option{
    padding:9px 12px;font-size:13px;color:var(--ink);cursor:pointer;
    border-bottom:1px dashed var(--rule);transition:background .12s ease,color .12s ease;
  }
  .cs-option:last-child{border-bottom:none;}
  .cs-option:hover{background:var(--paper-2);}
  .cs-option.active{color:var(--stamp-dim);font-weight:600;background:var(--paper-2);}

  .status{
    margin-top:16px;font-size:12.5px;
    color:var(--neg);display:none;line-height:1.6;
  }
  .status.show{display:block;}

  .output{margin-top:30px;display:none;}
  .output.show{display:block;animation:outputIn .35s ease both;}

  .issuebar{display:none;margin-bottom:14px;}
  .issuebar.show{display:block;animation:outputIn .3s ease both;}
  .issue-group{
    border:1px solid var(--rule);border-left:3px solid var(--warn);
    border-radius:2px;background:var(--warn-bg);
    padding:9px 12px;font-size:12px;line-height:1.6;color:var(--ink);
  }
  .issue-group + .issue-group{margin-top:8px;}
  .issue-group.corrected{border-left-color:var(--stamp);background:var(--fix-bg);}
  .issue-head{
    font-weight:700;font-size:11.5px;letter-spacing:.02em;
    color:var(--ink);margin-bottom:4px;
  }
  .issue-group.corrected .issue-head{color:var(--stamp-dim);}
  .issue-group.warn .issue-head{color:var(--warn);}
  .issue-line{color:var(--ink-dim);}
  .issue-line + .issue-line{margin-top:2px;}
  .output-head{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:10px;
  }
  .output-label{
    display:flex;flex-direction:column;gap:3px;
  }
  .output-label .ol-title{
    font-size:11px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--stamp-dim);font-weight:700;
  }
  .output-label .ol-sub{
    display:flex;align-items:center;gap:6px;
    font-size:11.5px;color:#2f9e5b;font-weight:600;
  }
  .ol-dot{
    width:6px;height:6px;border-radius:50%;
    background:#3ecc76;flex-shrink:0;
    box-shadow:0 0 0 0 rgba(62,204,118,.45);
    animation:dotPulse 2.2s ease-in-out infinite;
  }
  @keyframes dotPulse{
    0%,100%{box-shadow:0 0 0 0 rgba(62,204,118,.4);}
    50%{box-shadow:0 0 0 5px rgba(62,204,118,0);}
  }
  .copybtn{
    font-family:'Inter',sans-serif;font-size:12.5px;
    background:var(--ink);color:var(--paper);border:none;border-radius:2px;
    padding:8px 16px;cursor:pointer;font-weight:600;letter-spacing:.02em;
    transition:transform .12s ease, background .15s ease;
  }
  .copybtn:hover{background:var(--stamp);}
  .copybtn:active{transform:scale(.97);}
  .copybtn.done{background:var(--pos);}

  pre{
    display:none;
  }

  .receipt-card{
    background:var(--card);
    border-radius:22px;
    overflow:hidden;
    font-family:'Sarabun','Noto Sans Thai',sans-serif;
  }
  .r-head{
    background:#141414;
    color:#f6f4ee;
    padding:18px 20px 14px;
    text-align:center;
  }
  .r-head .r-brand{
    font-family:'Baloo 2',sans-serif;
    font-weight:800;
    font-size:17px;letter-spacing:.01em;
  }
  .r-head .r-brand .big-letter{
    font-size:21px;
  }
  .r-head .r-brand-sub{
    font-family:'Baloo 2',sans-serif;
    font-weight:800;
    font-size:13px;letter-spacing:.02em;text-transform:none;
    color:#a9a296;margin-top:6px;
  }
  .r-head .r-brand-sub .big-letter{
    font-size:13px;font-weight:800;
  }
  .r-meta{
    display:flex;justify-content:space-between;align-items:baseline;
    padding:11px 20px 9px;font-size:12.5px;color:var(--ink-dim);
  }
  .r-meta b{
    color:var(--ink);
    font-size:13.5px;font-weight:700;
  }
  .r-divider{border-top:1px dashed var(--rule);margin:0 20px;}
  .r-divider.strong{border-top:2px solid var(--ink);margin:0;}

  .r-row{
    display:flex;justify-content:space-between;align-items:flex-start;
    gap:14px;padding:9px 20px;
  }
  .r-row .r-left{flex:1;min-width:0;}
  .r-title{font-weight:700;font-size:14.5px;color:var(--ink);line-height:1.25;}
  .r-sub{font-size:12.5px;color:var(--ink);font-weight:600;margin-top:2px;line-height:1.25;}
  .r-caption{font-size:11px;color:var(--ink-dim);margin-top:1px;line-height:1.25;}
  .r-value{
    text-align:right;font-weight:700;font-size:15px;
    white-space:nowrap;color:var(--ink);line-height:1.25;
  }
  .r-value .r-pct{
    display:block;font-size:11.5px;font-weight:600;margin-top:1px;
  }
  .r-value.pos{color:var(--pos);}
  .r-value.neg{color:var(--neg);}

  .r-total .r-title{font-size:17px;}
  .r-total .r-value{font-size:20px;}
  .r-total{background:#00000006;}

  .r-title-sm{font-size:12.5px;color:var(--ink-dim);}
  .r-value-sm{font-size:13.5px;}

  .r-tap{
    text-align:center;padding:12px 20px 16px;
    font-size:11px;color:var(--ink-dim);letter-spacing:.02em;
  }

  .receipt-frame{
    border-radius:22px;
    box-shadow:0 14px 36px rgba(20,20,20,.16), 0 2px 6px rgba(20,20,20,.08);
  }

  footer{
    margin-top:40px;font-size:11px;
    color:var(--ink-dim);letter-spacing:.03em;
  }

  @media (prefers-reduced-motion: reduce){
    .drop,.copybtn{transition:none;}
  }
</style>
</head>

<script>
(function(){
  const dropZone = document.getElementById('dropZone');
  const dropInner = document.getElementById('dropInner');
  const stampIcon = document.getElementById('stampIcon');
  const dropTitle = document.getElementById('dropTitle');
  const dropTitleDefault = dropTitle ? dropTitle.textContent : '';
  const fileInput = document.getElementById('fileInput');
  const fileBar = document.getElementById('fileBar');
  const fileName = document.getElementById('fileName');
  const clearBtn = document.getElementById('clearBtn');
  const dateBar = document.getElementById('dateBar');
  const dateSelectWrap = document.getElementById('dateSelectWrap');
  const dateSelectTrigger = document.getElementById('dateSelectTrigger');
  const dateSelectLabel = document.getElementById('dateSelectLabel');
  const dateSelectMenu = document.getElementById('dateSelectMenu');
  const sheetNote = document.getElementById('sheetNote');
  let selectedIndex = 0;
  const statusEl = document.getElementById('status');
  const outputEl = document.getElementById('output');
  const issueBar = document.getElementById('issueBar');
  const receiptCard = document.getElementById('receiptCard');
  const copyBtn = document.getElementById('copyBtn');
  const historyBar = document.getElementById('historyBar');
  const historyList = document.getElementById('historyList');
  const historyClearBtn = document.getElementById('historyClearBtn');

  let entries = []; // {date, sheet, row}
  let skippedSheets = []; // sheet names skipped this parse due to a column-layout mismatch
  let dateMismatches = []; // {sheet, count, actualLabel} — rows skipped because their date didn't fall in the month the sheet's own name says
  let dayCountIssues = []; // {sheet, found, minDay, maxDay, missing:[], duplicates:[]} — gaps/duplicates in the run of daily dates found on a sheet
  let rawText = '';

  // ---------- number formatting ----------
  function parseNum(v){
    if(v===null||v===undefined) return NaN;
    if(v instanceof Date) return NaN;
    if(typeof v==='number') return v;
    let s = String(v).trim();
    if(s===''||s==='-') return NaN;
    if(s.startsWith('#')) return NaN;
    s = s.replace(/%/g,'').replace(/,/g,'').replace(/\s+/g,'');
    if(s==='') return NaN;
    const n = parseFloat(s);
    return isNaN(n) ? NaN : n;
  }

  function fmtMoney(v, forceSign){
    if(isNaN(v)) return '-';
    const r = Math.round(v);
    let sign = '';
    if(forceSign) sign = r>0?'+':(r<0?'-':'');
    else if(r<0) sign='-';
    return sign + Math.abs(r).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});
  }

  function fmtDecimalSigned(v, maxDec){
    if(isNaN(v)) return '-';
    const r = Math.round(v);
    const sign = r>0?'+':(r<0?'-':'');
    return sign + Math.abs(r).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0});
  }

  // Same as fmtMoney but keeps 2 decimal places instead of rounding to a
  // whole number — used for the Diff BG figure, which is meant to show
  // the exact daily-budget variance as it appears in the file (e.g.
  // 1,091,464.58), not a rounded integer.
  function fmtMoney2(v, forceSign){
    if(isNaN(v)) return '-';
    let sign = '';
    if(forceSign) sign = v>0?'+':(v<0?'-':'');
    else if(v<0) sign='-';
    return sign + Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  }

  // "Diff Budget" MTD figure: normally shown in MB, but any variance
  // under a full 1,000,000 (i.e. up to 999,999) either rounds to "0 MB"
  // or gets crammed into a misleadingly coarse "1 MB" — either way the
  // real size is lost. Any magnitude below 1,000,000 is shown in K
  // (nearest thousand) instead, so values from 500,000 up through
  // 999,999 still read as e.g. "+999 K" rather than being swallowed into
  // MB. From 1,000,000 up, shown in MB with 2 decimal places (e.g.
  // "4.16 MB") instead of rounding to a whole MB, so the figure stays
  // precise at that scale too.
  function fmtBudgetDiffUnit(v){
    if(isNaN(v)) return {text:'-', unit:'MB'};
    if(Math.abs(v) < 1000000){
      const k = Math.round(v/1000);
      const sign = k>0?'+':(k<0?'-':'');
      return {text: sign+Math.abs(k).toLocaleString('en-US'), unit:'K'};
    }
    const mb = v/1e6;
    const sign = mb>0?'+':(mb<0?'-':'');
    return {text: sign+Math.abs(mb).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}), unit:'MB'};
  }

  function fmtPercent(v, forceSign){
    if(isNaN(v)) return '-';
    const r = Number(v.toFixed(2));
    const sign = forceSign ? (r>0?'+':(r<0?'-':'')) : '';
    return sign + Math.abs(r).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}) + '%';
  }

  function fmtDate(d){
    const dd = String(d.getUTCDate()).padStart(2,'0');
    const mm = String(d.getUTCMonth()+1).padStart(2,'0');
    const yyyy = d.getUTCFullYear();
    return dd+'/'+mm+'/'+yyyy;
  }

  // Number of days in the entry's month (28/29/30/31) — used to spread
  // the fixed monthly budget into a daily target that adjusts per month.
  function daysInMonthUTC(d){
    return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth()+1, 0)).getUTCDate();
  }

  // Excel stores dates as day-count serials (day 0 = 1899-12-30, with the
  // 1900 leap-year bug already baked in). Building the Date directly with
  // Date.UTC keeps the calendar day fixed no matter what timezone the
  // browser is running in — this is what fixed the "date 28 goes missing /
  // everything shows one day early" bug (it was previously relying on
  // XLSX's cellDates:true, which builds a *local*-time Date; reading that
  // back out with getUTCDate() rolled it back a day in timezones ahead of
  // UTC, e.g. Thailand).
  function excelSerialToUTCDate(serial){
    return new Date(Date.UTC(1899, 11, 30) + Math.round(serial) * 86400000);
  }

  // Sheet names in the wild ("PF August 2026", "PF Jul 2025", "PF
  // April2026", "PF Mar2026", with or without a space before the year)
  // encode which month the sheet is supposed to hold. Used to catch the
  // recurring source-file mistake where a new month's tab is made by
  // copying the previous month's and the date column never gets updated
  // — the tab is named "PF July 2026" but every date in it still reads
  // June. Returns {year, month} (month 1-12) or null if the name doesn't
  // parse.
  const MONTH_NAME_TO_NUM = {
    jan:1, january:1, feb:2, february:2, mar:3, march:3, apr:4, april:4,
    may:5, jun:6, june:6, jul:7, july:7, aug:8, august:8,
    sep:9, sept:9, september:9, oct:10, october:10, nov:11, november:11,
    dec:12, december:12
  };
  function inferSheetMonth(sheetName){
    const m = sheetName.match(/([A-Za-z]+)\s*(\d{4})/);
    if(!m) return null;
    const month = MONTH_NAME_TO_NUM[m[1].toLowerCase()];
    if(!month) return null;
    return {year: parseInt(m[2],10), month: month};
  }
  const MONTH_TH = ['','ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

  // ---------- excel parsing ----------
  function cellAt(ws, r, c){
    const addr = XLSX.utils.encode_cell({r:r,c:c});
    const cell = ws[addr];
    return cell ? cell.v : undefined;
  }

  // For percentage columns specifically: prefer the cell's formatted
  // display text (cell.w) over its raw value (cell.v). Excel sheets in
  // the wild store percentages two different ways — as a text string
  // like "5.1%", or as a raw fraction (0.051) with a Percentage number
  // format applied. Reading .v directly works for the first case but
  // silently returns a value 100x too small for the second, since the
  // fraction itself (0.051) gets treated as if it already meant "0.051%".
  // .w is the value already rendered through Excel's number format, so
  // it reads correctly ("5.1%") no matter which way the cell was authored.
  function pctAt(ws, r, c){
    const addr = XLSX.utils.encode_cell({r:r,c:c});
    const cell = ws[addr];
    if(!cell) return undefined;
    if(typeof cell.w === 'string' && cell.w.trim() !== '') return cell.w;
    return cell.v;
  }

  // Some "Diff %" columns in the source file are stored with less
  // precision than the report needs — e.g. TC Diff% saved as a whole
  // number ("-3%"), TV Diff% to 1 decimal ("2.3%"), EOC Tc Diff% with no
  // decimal at all ("13") — while the Diff (Baht/count) figure right next
  // to it is exact. Reading the file's own rounded percentage and merely
  // padding it to 2 decimals (e.g. "-3.00%") makes it look more precise
  // than it is, and it can visibly disagree with the exact Diff shown
  // beside it. So every "Diff %" in the report is computed here directly
  // from the exact figures already on the row (diff ÷ base × 100)
  // instead of trusting the file's own (sometimes coarsely rounded)
  // percentage cell.
  function pctOf(diff, base){
    return (isNaN(diff) || isNaN(base) || base === 0) ? NaN : (diff / base * 100);
  }

  // ---------- data validation / auto-correction ----------
  // Sanity-checks values read out of the sheet and, where the fix is
  // unambiguous, corrects them in place — always recording *why*, so the
  // report can tell the person exactly what was wrong and what was done
  // about it instead of silently showing a different number than the file.
  const CORRECT_TOLERANCE = 1; // baht/count — rounding slack before a Diff mismatch counts as an error
  const EXTREME_PCT = 300; // %-change beyond this is flagged as suspicious (not auto-fixed, just surfaced)

  // A "Diff" column should always equal (2026 value − 2025 value). If the
  // file's own Diff cell disagrees with that arithmetic (or is missing
  // entirely), the file is treated as wrong and the Diff is recomputed —
  // this mirrors the existing Diff% policy above (pctOf), extended to the
  // raw Diff figures themselves.
  function fixDiffPair(label, v2026, v2025, vDiff, corrections){
    if(isNaN(v2026) || isNaN(v2025)) return vDiff;
    const expected = v2026 - v2025;
    if(isNaN(vDiff)){
      corrections.push(label+': ไม่มีค่า Diff ในไฟล์ — คำนวณอัตโนมัติจาก 2026 − 2025 = '+fmtMoney(expected,true));
      return expected;
    }
    if(Math.abs(vDiff - expected) > CORRECT_TOLERANCE){
      corrections.push(label+': ค่า Diff ในไฟล์ ('+fmtMoney(vDiff,true)+') ไม่ตรงกับ 2026 − 2025 ('+fmtMoney(expected,true)+') — แก้ไขให้ใช้ค่าที่คำนวณใหม่');
      return expected;
    }
    return vDiff;
  }

  // Sales / TC / TV / EOC figures represent counts or money and should
  // never be negative — a negative value here almost always means a sign
  // got typed or pasted in by mistake, so it's corrected to its absolute
  // value rather than left to poison every Diff/% derived from it.
  function fixNonNegative(label, v, corrections){
    if(isNaN(v) || v >= 0) return v;
    corrections.push(label+': ค่าติดลบซึ่งผิดปกติ ('+fmtMoney(v,true)+') — แก้ไขเป็นค่าสัมบูรณ์ '+fmtMoney(Math.abs(v)));
    return Math.abs(v);
  }

  // The "Diff BG" figure stored in the file (column 26) is that single
  // day's actual sales minus the daily budget target the SOURCE FILE
  // itself used for that day — a target it gets by dividing the fixed
  // monthly Budget by however many days it thinks the month has. A
  // common source-file mistake is dividing by the wrong day count (e.g.
  // a sheet copied from a 31-day month still divides by 31 after being
  // relabeled for a 30-day month), which throws off every "Diff BG" and
  // its % in the report even though the underlying sales figure is
  // fine. Detected by reverse-engineering the daily budget the file
  // must have used (sale2026 − storedDiffBG), working out which whole
  // day-count would produce that number, and comparing it against the
  // day count this row's actual date really has.
  function fixBudgetDiffDayCount(sale2026, storedDiffBG, correctDailyBG, monthBudget, actualDays, corrections){
    if(isNaN(sale2026) || isNaN(storedDiffBG) || isNaN(correctDailyBG) || isNaN(monthBudget) || !monthBudget) return storedDiffBG;
    const impliedDailyBG = sale2026 - storedDiffBG;
    if(Math.abs(impliedDailyBG - correctDailyBG) <= CORRECT_TOLERANCE) return storedDiffBG;
    const impliedDays = Math.round(monthBudget / impliedDailyBG);
    if(impliedDays >= 28 && impliedDays <= 31 && impliedDays !== actualDays){
      corrections.push('Diff BG: ไฟล์หารเป้าเฉลี่ยรายวันด้วย '+impliedDays+' วัน แต่เดือนนี้มี '+actualDays+' วันจริง — คำนวณเป้ารายวันใหม่ ('+fmtMoney(correctDailyBG,true)+'/วัน) และแก้ Diff BG ให้ตรง');
      return sale2026 - correctDailyBG;
    }
    return storedDiffBG;
  }

  // Extreme swings (e.g. a Diff% of +2000%) are usually a sign that a
  // decimal point, unit, or year got mixed up somewhere upstream — but
  // unlike the checks above there's no single unambiguous "correct"
  // value to fall back to, so these are only surfaced as a warning for a
  // human to check, never silently rewritten.
  function warnIfExtreme(label, pct, warnings){
    if(!isNaN(pct) && Math.abs(pct) > EXTREME_PCT){
      warnings.push(label+': เปอร์เซ็นต์เปลี่ยนแปลงสูงผิดปกติ ('+fmtPercent(pct,true)+') — โปรดตรวจสอบข้อมูลต้นทาง');
    }
  }

  // Not every sheet in the workbook uses the same column layout. Some
  // tabs (seen in the wild named e.g. "PF Aug 2025") are a completely
  // different "Food Story" year-over-year comparison that happens to
  // reuse columns 13–19 for its own Sales/TC/Throw-away figures instead
  // of EOC — parsing those with the fixed column offsets below would
  // silently read "Food Story Sales" as if it were "EOC 2026", etc.
  // Checking for the literal "EOC" header near column 13 (present on
  // every real report sheet) tells the two layouts apart before any
  // row is parsed, so mismatched sheets are skipped instead of
  // producing nonsense entries.
  function sheetHasExpectedLayout(ws, range){
    const scanEnd = Math.min(range.s.r + 8, range.e.r);
    for(let r=range.s.r; r<=scanEnd; r++){
      const h = cellAt(ws, r, 13);
      if(typeof h === 'string' && h.toUpperCase().indexOf('EOC') !== -1) return true;
    }
    return false;
  }

  function findMtdBlock(ws, range){
    for(let r=range.s.r; r<=range.e.r; r++){
      const a = cellAt(ws, r, 0);
      if(typeof a === 'string' && a.trim().toUpperCase() === 'MTD'){
        const pf = r+1, bg = r+2, tot = r+3, pct = r+4;
        return {
          mtd2026: parseNum(cellAt(ws,pf,1)),
          mtd2025: parseNum(cellAt(ws,pf,2)),
          mtdDiff: parseNum(cellAt(ws,pf,3)),
          mtdDiffPct: parseNum(pctAt(ws,pf,4)),
          budget: parseNum(cellAt(ws,bg,1)),
          budgetDiff: parseNum(cellAt(ws,tot,1)),
          budgetDiffPct: parseNum(pctAt(ws,pct,1)),
        };
      }
    }
    return null;
  }

  // Bottom "Budget"/"Diff" block: Budget is the fixed full-month target
  // (static, from the MTD block) — it doesn't change day to day. But its
  // Diff is cumulative sales-so-far minus that fixed full-month target
  // (i.e. how far ahead/behind pace the month is running), which DOES
  // change per selected day. This is distinct from the top per-day
  // "Diff Budget" line under PF Sale, which uses that single day's own
  // AA/AB variance against that day's daily budget.
  function parseWorkbookFull(wb){
    entries = [];
    skippedSheets = [];
    dateMismatches = [];
    dayCountIssues = [];
    wb.SheetNames.forEach(function(sheetName){
      const ws = wb.Sheets[sheetName];
      if(!ws['!ref']) return;
      const range = XLSX.utils.decode_range(ws['!ref']);

      if(!sheetHasExpectedLayout(ws, range)){
        skippedSheets.push(sheetName);
        return;
      }

      // Expected (year, month) from the sheet's own name, if it parses —
      // rows whose actual date falls outside this are a source-file
      // labeling mistake (see inferSheetMonth above), not a second
      // legitimate date, so they're excluded from entries/cumulative
      // totals rather than shown as extra picker rows.
      const expectedMonth = inferSheetMonth(sheetName);
      const mismatchMonths = {}; // 'YYYY-MM' -> count, for this sheet (rows that stay excluded)

      // Pre-scan: some sheets have EVERY date wrong by a clean, constant
      // offset (e.g. tab "PF July 2026" made by copying "PF June 2026"
      // and never advancing the date column — every row reads a month
      // early). When that's the case — one single wrong (year, month)
      // bucket, shared by literally every dated row, none matching the
      // sheet's own name — the sales figures themselves are still real
      // for that month (verified against the corresponding correctly-
      // dated sheet), so it's corrected by shifting each date by the
      // needed number of months rather than discarding the whole sheet's
      // data. A sheet with a MIX of right and wrong dates (e.g. one
      // stray leftover row) does not qualify — that's a one-off data
      // error, not a systemic offset, and is left alone (flagged, not
      // guessed at).
      let sheetDateOffsetMonths = null;
      if(expectedMonth){
        const buckets = {};
        let sawExpected = false;
        for(let r=range.s.r; r<=range.e.r; r++){
          const rd = cellAt(ws, r, 0);
          if(typeof rd !== 'number') continue;
          const d = excelSerialToUTCDate(rd);
          const y = d.getUTCFullYear(), mo = d.getUTCMonth()+1;
          if(y === expectedMonth.year && mo === expectedMonth.month){ sawExpected = true; }
          else{ buckets[y+'-'+mo] = true; }
        }
        const bucketKeys = Object.keys(buckets);
        if(!sawExpected && bucketKeys.length === 1){
          const parts = bucketKeys[0].split('-');
          const actualYear = parseInt(parts[0],10), actualMonthNum = parseInt(parts[1],10);
          const delta = (expectedMonth.year*12+expectedMonth.month) - (actualYear*12+actualMonthNum);
          if(delta !== 0 && Math.abs(delta) <= 12) sheetDateOffsetMonths = delta;
        }
      }

      const mtd = findMtdBlock(ws, range);

      // The Budget figure in the MTD block is shared by every row parsed
      // from this sheet, so it's validated once per sheet (not once per
      // row) — otherwise the same correction message would be duplicated
      // on every single date pulled from that month.
      const sheetCorrections = [];
      if(mtd && !isNaN(mtd.budget) && mtd.budget < 0){
        sheetCorrections.push('Budget MTD: ค่าติดลบผิดปกติ ('+fmtMoney(mtd.budget,true)+') — แก้ไขเป็นค่าสัมบูรณ์ '+fmtMoney(Math.abs(mtd.budget)));
        mtd.budget = Math.abs(mtd.budget);
      }
      if(sheetDateOffsetMonths){
        sheetCorrections.push('วันที่: ทั้งชีตนี้ ('+sheetName+') อ่านวันที่ผิดไป '+Math.abs(sheetDateOffsetMonths)+' เดือน (คอลัมน์วันที่ไม่ได้ถูกแก้ตอนสร้างชีต) — เลื่อนวันที่ทุกแถวให้ตรงกับชื่อชีตแล้ว โดยไม่แตะยอดขาย');
      }

      // Every calendar day found on this sheet (of valid, in-month rows
      // only) — used after the row loop to check the sheet actually has
      // a complete, unbroken run of daily entries instead of silently
      // showing whatever days happened to make it into the file.
      const sheetDates = [];

      let cumSale = 0;
      let cumSale2025 = 0;
      for(let r=range.s.r; r<=range.e.r; r++){
        const rawDate = cellAt(ws, r, 0);
        if(typeof rawDate !== 'number') continue;
        let a = excelSerialToUTCDate(rawDate);

        if(sheetDateOffsetMonths){
          a = new Date(Date.UTC(a.getUTCFullYear(), a.getUTCMonth()+sheetDateOffsetMonths, a.getUTCDate()));
        }

        if(expectedMonth && (a.getUTCFullYear() !== expectedMonth.year || (a.getUTCMonth()+1) !== expectedMonth.month)){
          const key = a.getUTCFullYear()+'-'+(a.getUTCMonth()+1);
          mismatchMonths[key] = (mismatchMonths[key]||0) + 1;
          continue;
        }

        let sale2026 = parseNum(cellAt(ws,r,1));
        if(isNaN(sale2026)) continue;

        const corrections = sheetCorrections.slice();
        const warnings = [];

        sale2026 = fixNonNegative('ยอดขาย 2026', sale2026, corrections);
        cumSale += sale2026;
        let sale2025ForRow = parseNum(cellAt(ws,r,2));
        sale2025ForRow = fixNonNegative('ยอดขาย 2025', sale2025ForRow, corrections);
        cumSale2025 += isNaN(sale2025ForRow) ? 0 : sale2025ForRow;

        const sale2025 = sale2025ForRow;
        let saleDiff = parseNum(cellAt(ws,r,3));
        let tc2026 = fixNonNegative('TC 2026', parseNum(cellAt(ws,r,5)), corrections);
        let tc2025 = fixNonNegative('TC 2025', parseNum(cellAt(ws,r,6)), corrections);
        let tcDiff = parseNum(cellAt(ws,r,7));
        let tv2026 = fixNonNegative('TV 2026', parseNum(cellAt(ws,r,9)), corrections);
        let tv2025 = fixNonNegative('TV 2025', parseNum(cellAt(ws,r,10)), corrections);
        let tvDiff = parseNum(cellAt(ws,r,11));
        let eoc2026 = fixNonNegative('EOC 2026', parseNum(cellAt(ws,r,13)), corrections);
        let eoc2025 = fixNonNegative('EOC 2025', parseNum(cellAt(ws,r,14)), corrections);
        let eocDiff = parseNum(cellAt(ws,r,15));
        let eocTc2026 = fixNonNegative('EOC Tc 2026', parseNum(cellAt(ws,r,17)), corrections);
        let eocTc2025 = fixNonNegative('EOC Tc 2025', parseNum(cellAt(ws,r,18)), corrections);
        let eocTcDiff = parseNum(cellAt(ws,r,19));
        const tw = parseNum(cellAt(ws,r,21));
        const cpn = parseNum(cellAt(ws,r,23));
        const budgetDiff = parseNum(cellAt(ws,r,26));

        // Diff columns are trusted only if they agree with (2026 − 2025)
        // on the already-cleaned values above; otherwise recomputed.
        saleDiff = fixDiffPair('Diff ยอดขาย', sale2026, sale2025, saleDiff, corrections);
        tcDiff = fixDiffPair('Diff TC', tc2026, tc2025, tcDiff, corrections);
        tvDiff = fixDiffPair('Diff TV', tv2026, tv2025, tvDiff, corrections);
        eocDiff = fixDiffPair('Diff EOC', eoc2026, eoc2025, eocDiff, corrections);
        eocTcDiff = fixDiffPair('Diff EOC Tc', eocTc2026, eocTc2025, eocTcDiff, corrections);

        const saleDiffPct = pctOf(saleDiff, sale2025);
        const tcDiffPct = pctOf(tcDiff, tc2025);
        const tvDiffPct = pctOf(tvDiff, tv2025);
        const eocDiffPct = pctOf(eocDiff, eoc2025);
        const eocTcDiffPct = pctOf(eocTcDiff, eocTc2025);
        warnIfExtreme('Diff ยอดขาย %', saleDiffPct, warnings);
        warnIfExtreme('Diff TC %', tcDiffPct, warnings);
        warnIfExtreme('Diff TV %', tvDiffPct, warnings);
        warnIfExtreme('Diff EOC %', eocDiffPct, warnings);
        warnIfExtreme('Diff EOC Tc %', eocTcDiffPct, warnings);

        // Daily budget target for this specific row's date (fixed monthly
        // budget spread evenly across the days in that month) — the base
        // that "Diff BG" is measured against.
        const dailyBGForRow = (mtd && !isNaN(mtd.budget)) ? (mtd.budget / daysInMonthUTC(a)) : NaN;

        const budgetDiffFixed = fixBudgetDiffDayCount(
          sale2026, budgetDiff, dailyBGForRow,
          (mtd ? mtd.budget : NaN), daysInMonthUTC(a), corrections
        );

        entries.push({
          date: a,
          sheet: sheetName,
          corrections: corrections,
          warnings: warnings,
          row: {
            sale2026: sale2026,
            sale2025: sale2025,
            saleDiff: saleDiff,
            saleDiffPct: saleDiffPct,
            tc2026: tc2026,
            tc2025: tc2025,
            tcDiff: tcDiff,
            tcDiffPct: tcDiffPct,
            tv2026: tv2026,
            tv2025: tv2025,
            tvDiff: tvDiff,
            tvDiffPct: tvDiffPct,
            eoc2026: eoc2026,
            eoc2025: eoc2025,
            eocDiff: eocDiff,
            eocDiffPct: eocDiffPct,
            eocTc2026: eocTc2026,
            eocTc2025: eocTc2025,
            eocTcDiff: eocTcDiff,
            eocTcDiffPct: eocTcDiffPct,
            tw: tw,
            twPct: pctOf(tw, sale2026),
            cpn: cpn,
            cpnPct: pctOf(cpn, sale2026),
            budgetDiff: budgetDiffFixed,
            budgetDiffPct: pctOf(budgetDiffFixed, dailyBGForRow),
          },
          mtd: mtd,
          cumSale: cumSale,
          cumSale2025: cumSale2025
        });
        sheetDates.push(a.getUTCDate());
      }

      // Check this sheet has an unbroken run of daily dates (no skipped
      // day between the earliest and latest date found) and no date
      // entered twice. A gap almost always means a day's row went
      // missing when the sheet was built; a duplicate means the same
      // day got pasted in twice — both are surfaced here rather than
      // only showing up as an unexplained hole in the date picker.
      if(sheetDates.length){
        const seen = {};
        const dupSet = {};
        sheetDates.forEach(function(d){
          seen[d] = (seen[d]||0) + 1;
          if(seen[d] > 1) dupSet[d] = true;
        });
        const uniqueDays = Object.keys(seen).map(Number).sort(function(a,b){ return a-b; });
        const minDay = uniqueDays[0], maxDay = uniqueDays[uniqueDays.length-1];
        const missing = [];
        for(let d=minDay; d<=maxDay; d++){
          if(!seen[d]) missing.push(d);
        }
        const duplicates = Object.keys(dupSet).map(Number).sort(function(a,b){ return a-b; });
        if(missing.length || duplicates.length){
          dayCountIssues.push({
            sheet: sheetName,
            found: uniqueDays.length,
            minDay: minDay,
            maxDay: maxDay,
            missing: missing,
            duplicates: duplicates
          });
        }
      }

      Object.keys(mismatchMonths).forEach(function(key){
        const parts = key.split('-');
        const y = parseInt(parts[0],10), mo = parseInt(parts[1],10);
        dateMismatches.push({
          sheet: sheetName,
          count: mismatchMonths[key],
          actualLabel: (MONTH_TH[mo]||mo)+' '+y
        });
      });
    });
    entries.sort(function(a,b){ return b.date - a.date; });
  }

  // MTD 2026/2025/Diff must reflect the running total UP TO the selected
  // day, not the fixed end-of-sheet MTD block (that block is a snapshot
  // as of whatever day the sheet was last updated, e.g. day 28, and stays
  // the same for every date picked from that sheet — which was the bug).
  // Only the Budget figure legitimately comes from that static block.
  function mtdAsOfDay(entry){
    const mtd2026 = entry.cumSale;
    const mtd2025 = entry.cumSale2025;
    const mtdDiff = (isNaN(mtd2026) || isNaN(mtd2025)) ? NaN : (mtd2026 - mtd2025);
    const mtdDiffPct = (isNaN(mtdDiff) || !mtd2025) ? NaN : (mtdDiff / mtd2025 * 100);
    return {mtd2026:mtd2026, mtd2025:mtd2025, mtdDiff:mtdDiff, mtdDiffPct:mtdDiffPct};
  }

  // FIGURE SPACE (U+2007) — Unicode defines this to have the same advance
  // width as a digit "0", including in most proportional (non-monospace)
  // fonts. We pad numbers with it instead of a plain space, so the digit
  // groups / commas still line up after rawText is pasted somewhere like
  // LINE or Facebook, where a regular space renders narrower than a digit.
  const FSP = '\u2007';

  // All labels that appear before "=" in the report — used to compute one
  // shared column width so every "=" sign lines up, instead of the old
  // hand-counted spaces (which drifted out of alignment).
  const REPORT_LABELS = ['2026','2025','Diff','Diff BG','Budget','TW','CPN'];
  const LABEL_W = Math.max.apply(null, REPORT_LABELS.map(function(s){ return s.length; }));

  function kv(label, value, extra){
    const extraSp = extra ? ' '.repeat(extra) : '';
    return label.padEnd(LABEL_W, ' ') + extraSp + ' = ' + value;
  }

  // Right-align a set of already-formatted (comma-grouped) numbers against
  // each other by padding the shorter ones on the left with figure spaces,
  // so their last digits — and the comma groups above them — line up.
  function alignNums(){
    const strs = Array.prototype.slice.call(arguments);
    const w = Math.max.apply(null, strs.map(function(s){ return s.length; }));
    return strs.map(function(s){ return s.padStart(w, FSP); });
  }

  function renderReport(entry){
    const d = entry.row, m = entry.mtd || {}, mAsOf = mtdAsOfDay(entry);
    const budgetMB = isNaN(m.budget) ? '-' : (m.budget/1e6).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
    const budgetDiffToDate = (isNaN(m.budget) || isNaN(entry.cumSale)) ? NaN : (entry.cumSale - m.budget);
    const diffBudget = fmtBudgetDiffUnit(budgetDiffToDate);
    const budgetPct = (isNaN(budgetDiffToDate) || !m.budget) ? '-' : fmtPercent(budgetDiffToDate/m.budget*100,true);
    const dailyBG = isNaN(m.budget) ? NaN : (m.budget / daysInMonthUTC(entry.date));

    const sale = [fmtMoney(d.sale2026), fmtMoney(d.sale2025)];
    const tc = alignNums(fmtMoney(d.tc2026), fmtMoney(d.tc2025));
    const tv = alignNums(fmtMoney(d.tv2026), fmtMoney(d.tv2025));
    const eoc = [fmtMoney(d.eoc2026), fmtMoney(d.eoc2025)];
    const eocTc = alignNums(fmtMoney(d.eocTc2026), fmtMoney(d.eocTc2025));
    const mtd = alignNums(fmtMoney(mAsOf.mtd2026), fmtMoney(mAsOf.mtd2025));

    const lines = [
      'PF Sale '+fmtDate(entry.date),
    ];
    if(entry.corrections && entry.corrections.length){
      lines.push('(ข้อมูลบางจุดถูกแก้ไขอัตโนมัติ '+entry.corrections.length+' รายการ — ดูรายละเอียดในแอป)');
    }
    lines.push(
      kv('2026', sale[0]),
      kv('2025', sale[1]),
      kv('Diff', fmtMoney(d.saleDiff,true)+' ('+fmtPercent(d.saleDiffPct,true)+')', 3),
      kv('Diff BG', fmtMoney(d.budgetDiff,true)+' ('+fmtPercent(d.budgetDiffPct,true)+')'),
      '*****************************',
      'TC  ',
      kv('2026', tc[0]),
      kv('2025', tc[1]),
      kv('Diff', fmtMoney(d.tcDiff,true)+' ('+fmtPercent(d.tcDiffPct,true)+')', 3),
      '*****************************',
      'TV',
      kv('2026', tv[0]),
      kv('2025', tv[1]),
      kv('Diff', fmtMoney(d.tvDiff,true)+' ('+fmtPercent(d.tvDiffPct,true)+')', 3),
      '*****************************',
      'EOC',
      kv('2026', eoc[0]),
      kv('2025', eoc[1]),
      kv('Diff', fmtMoney(d.eocDiff,true)+' ('+fmtPercent(d.eocDiffPct,true)+')', 3),
      'Tc',
      kv('2026', eocTc[0]),
      kv('2025', eocTc[1]),
      kv('Diff', fmtMoney(d.eocTcDiff,true)+' ('+fmtPercent(d.eocTcDiffPct,true)+')', 3),
      '*****************************',
      'MTD',
      kv('2026', mtd[0]),
      kv('2025', mtd[1]),
      kv('Diff', fmtMoney(mAsOf.mtdDiff,true)+' ('+fmtPercent(mAsOf.mtdDiffPct,true)+')', 3),
      '*****************************',
      kv('BG', budgetMB+' MB', 2),
      kv('Diff', diffBudget.text+' '+diffBudget.unit+' ('+budgetPct+')', 3),
      '*****************************',
      kv('TW', fmtMoney(d.tw)+' ('+fmtPercent(d.twPct,false)+')', 1),
      kv('CPN', fmtMoney(d.cpn)+' ('+fmtPercent(d.cpnPct,false)+')'),
      '*****************************'
    );
    return lines.join('\n');
  }

  function esc(s){
    return String(s).replace(/[&<>]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; });
  }

  function signClass(v){
    if(isNaN(v)) return '';
    return v>0 ? 'pos' : (v<0 ? 'neg' : '');
  }

  function buildReceiptHTML(entry){
    const d = entry.row, m = entry.mtd || {}, mAsOf = mtdAsOfDay(entry);
    const budgetMB = isNaN(m.budget) ? '-' : (m.budget/1e6).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
    const budgetDiffToDate = (isNaN(m.budget) || isNaN(entry.cumSale)) ? NaN : (entry.cumSale - m.budget);
    const diffBudget = fmtBudgetDiffUnit(budgetDiffToDate);
    const budgetPct = (isNaN(budgetDiffToDate) || !m.budget) ? '-' : fmtPercent(budgetDiffToDate/m.budget*100,true);
    const dailyBG = isNaN(m.budget) ? NaN : (m.budget / daysInMonthUTC(entry.date));
    const code = 'PF'+String(entry.date.getUTCDate()).padStart(2,'0')+String(entry.date.getUTCMonth()+1).padStart(2,'0');

    function subLines(lines){
      return lines.map(function(l){ return '<div class="r-sub">'+l+'</div>'; }).join('');
    }

    function row(title, lines, captionHtml, diffVal, diffFmt, pctFmt, small){
      return '<div class="r-row">'
        + '<div class="r-left">'
          + '<div class="r-title'+(small?' r-title-sm':'')+'">'+esc(title)+'</div>'
          + subLines(lines||[])
          + (captionHtml || '')
        + '</div>'
        + '<div class="r-value'+(small?' r-value-sm':'')+' '+signClass(diffVal)+'">'+diffFmt+(pctFmt?'<span class="r-pct">'+pctFmt+'</span>':'')+'</div>'
      + '</div>';
    }

    let html = '';
    html += '<div class="r-head">'
      + '<div class="r-brand"><span class="big-letter">P</span>HUKET <span class="big-letter">F</span>LORESTA</div>'
      + '<div class="r-brand-sub"><span class="big-letter">S</span>ales <span class="big-letter">R</span>eport</div>'
      + '</div>';
    html += '<div class="r-meta"><span>'+fmtDate(entry.date)+'</span><b>'+code+'</b></div>';
    html += '<div class="r-divider"></div>';

    html += row('PF Sale',
      ['2026 = '+fmtMoney(d.sale2026), '2025 = '+fmtMoney(d.sale2025)],
      '',
      d.saleDiff, fmtMoney(d.saleDiff,true), fmtPercent(d.saleDiffPct,true));
    html += '<div class="r-divider"></div>';

    html += row('Diff BG', ['('+fmtMoney2(dailyBG,false)+')'], '',
      d.budgetDiff, fmtMoney2(d.budgetDiff,true), fmtPercent(d.budgetDiffPct,true));
    html += '<div class="r-divider"></div>';

    html += row('TC',
      ['2026 = '+fmtMoney(d.tc2026), '2025 = '+fmtMoney(d.tc2025)],
      '', d.tcDiff, fmtMoney(d.tcDiff,true), fmtPercent(d.tcDiffPct,true));
    html += '<div class="r-divider"></div>';

    html += row('TV',
      ['2026 = '+fmtMoney(d.tv2026), '2025 = '+fmtMoney(d.tv2025)],
      '', d.tvDiff, fmtMoney(d.tvDiff,true), fmtPercent(d.tvDiffPct,true));
    html += '<div class="r-divider"></div>';

    html += row('EOC',
      ['2026 = '+fmtMoney(d.eoc2026), '2025 = '+fmtMoney(d.eoc2025)],
      '', d.eocDiff, fmtMoney(d.eocDiff,true), fmtPercent(d.eocDiffPct,true));
    html += row('Tc',
      ['2026 = '+fmtMoney(d.eocTc2026), '2025 = '+fmtMoney(d.eocTc2025)],
      '', d.eocTcDiff, fmtMoney(d.eocTcDiff,true), fmtPercent(d.eocTcDiffPct,true), true);

    html += '<div class="r-divider strong"></div>';
    html += '<div class="r-row r-total">'
      + '<div class="r-left">'
        + '<div class="r-title">ยอดรวม MTD</div>'
        + '<div class="r-sub">Month to Date</div>'
        + '<div class="r-sub">2026 = '+fmtMoney(mAsOf.mtd2026)+'</div>'
        + '<div class="r-sub">2025 = '+fmtMoney(mAsOf.mtd2025)+'</div>'
      + '</div>'
      + '<div class="r-value '+signClass(mAsOf.mtdDiff)+'">'+fmtMoney(mAsOf.mtdDiff,true)+'<span class="r-pct">'+fmtPercent(mAsOf.mtdDiffPct,true)+'</span></div>'
    + '</div>';
    html += '<div class="r-divider strong"></div>';

    html += row('Budget MTD', [], '', NaN, budgetMB+' MB', '');
    html += '<div class="r-divider"></div>';
    html += row('Diff Budget', [], '', budgetDiffToDate, diffBudget.text+' '+diffBudget.unit, budgetPct);
    html += '<div class="r-divider"></div>';

    html += row('TW', [], '', NaN, fmtMoney(d.tw), fmtPercent(d.twPct,false), true);
    html += row('CPN', [], '', NaN, fmtMoney(d.cpn), fmtPercent(d.cpnPct,false), true);

    html += '<div class="r-tap">สร้างโดยอัตโนมัติ · กด Copy ด้านบนเพื่อคัดลอกข้อความ</div>';
    return html;
  }

  // ---------- upload history (localStorage, stays on this device) ----------
  const HISTORY_KEY = 'pfSalesUploadHistory';
  const HISTORY_MAX = 15;

  // Base64 <-> bytes helpers for stashing the raw .xlsx file so a history
  // entry can be fully reloaded and re-parsed later, not just relabeled.
  function bytesToBase64(bytes){
    let binary = '';
    const chunk = 0x8000;
    for(let i=0; i<bytes.length; i+=chunk){
      binary += String.fromCharCode.apply(null, bytes.subarray(i, i+chunk));
    }
    return btoa(binary);
  }
  function base64ToBytes(b64){
    const binary = atob(b64);
    const bytes = new Uint8Array(binary.length);
    for(let i=0; i<binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }

  function loadHistory(){
    try{
      const raw = localStorage.getItem(HISTORY_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){
      return [];
    }
  }

  // Writes the list, and if the browser's storage quota is exceeded (large
  // files can add up), drops the oldest entries one at a time and retries
  // until it fits, rather than losing the whole history silently.
  function saveHistoryList(list){
    const arr = list.slice();
    while(true){
      try{
        localStorage.setItem(HISTORY_KEY, JSON.stringify(arr));
        return arr;
      }catch(e){
        if(arr.length === 0) return arr;
        arr.pop();
      }
    }
  }

  function addToHistory(name, bytes){
    const list = loadHistory();
    list.unshift({
      id: Date.now()+'-'+Math.random().toString(36).slice(2,8),
      name: name,
      uploadedAt: new Date().toISOString(),
      data: bytesToBase64(bytes)
    });
    while(list.length > HISTORY_MAX) list.pop();
    saveHistoryList(list);
    renderHistory();
  }

  function removeFromHistory(id){
    saveHistoryList(loadHistory().filter(function(item){ return item.id !== id; }));
    renderHistory();
  }

  function clearHistoryAll(){
    saveHistoryList([]);
    renderHistory();
  }

  function fmtHistoryDate(iso){
    const d = new Date(iso);
    const dd = String(d.getDate()).padStart(2,'0');
    const mm = String(d.getMonth()+1).padStart(2,'0');
    const yyyy = d.getFullYear();
    const hh = String(d.getHours()).padStart(2,'0');
    const mi = String(d.getMinutes()).padStart(2,'0');
    return dd+'/'+mm+'/'+yyyy+' '+hh+':'+mi;
  }

  function renderHistory(){
    const list = loadHistory();
    historyList.innerHTML = '';
    if(list.length === 0){
      historyBar.classList.remove('show');
      return;
    }
    historyBar.classList.add('show');
    list.forEach(function(item){
      const row = document.createElement('div');
      row.className = 'history-item';

      const info = document.createElement('div');
      info.className = 'history-info';
      const nameEl = document.createElement('b');
      nameEl.textContent = item.name;
      const dateEl = document.createElement('span');
      dateEl.textContent = fmtHistoryDate(item.uploadedAt);
      info.appendChild(nameEl);
      info.appendChild(dateEl);
      info.addEventListener('click', function(){ loadFromHistory(item); });

      const delBtn = document.createElement('button');
      delBtn.type = 'button';
      delBtn.className = 'history-del';
      delBtn.textContent = 'ลบ';
      delBtn.addEventListener('click', function(e){
        e.stopPropagation();
        removeFromHistory(item.id);
      });

      row.appendChild(info);
      row.appendChild(delBtn);
      historyList.appendChild(row);
    });
  }

  function loadFromHistory(item){
    hideStatus();
    outputEl.classList.remove('show');
    dateBar.classList.remove('show');
    closeDateMenu();
    fileName.textContent = item.name;
    fileBar.classList.remove('show');
    void fileBar.offsetWidth;
    fileBar.classList.add('show');

    if(stampIcon){
      stampIcon.classList.remove('success');
      void stampIcon.offsetWidth;
      stampIcon.classList.add('success');
    }

    try{
      const bytes = base64ToBytes(item.data);
      const wb = XLSX.read(bytes, {type:'array'});
      parseWorkbookFull(wb);
      if(entries.length === 0){
        showStatus('ไม่พบแถวข้อมูลยอดขายที่มีวันที่และตัวเลขปี 2026 ในไฟล์นี้');
        renderSheetNote();
        return;
      }
      populateDateSelect();
      renderSheetNote();
      showReportForIndex(0);
    }catch(err){
      showStatus('เกิดข้อผิดพลาดในการโหลดไฟล์จากประวัติ: '+err.message);
    }
  }

  historyClearBtn.addEventListener('click', function(){
    clearHistoryAll();
  });

  renderHistory();

  // ---------- UI wiring ----------
  function showStatus(msg){
    statusEl.textContent = msg;
    statusEl.classList.add('show');
  }
  function hideStatus(){
    statusEl.classList.remove('show');
    statusEl.textContent = '';
  }

  function closeDateMenu(){
    dateSelectWrap.classList.remove('open');
    dateSelectTrigger.setAttribute('aria-expanded', 'false');
  }
  function openDateMenu(){
    dateSelectWrap.classList.add('open');
    dateSelectTrigger.setAttribute('aria-expanded', 'true');
  }

  function populateDateSelect(){
    dateSelectMenu.innerHTML = '';
    entries.forEach(function(e, i){
      const opt = document.createElement('div');
      opt.className = 'cs-option';
      opt.setAttribute('role', 'option');
      opt.dataset.index = i;
      const issueMark = (e.corrections && e.corrections.length) ? '  ⚠ แก้ไขแล้ว'
        : ((e.warnings && e.warnings.length) ? '  ⚠ ตรวจสอบ' : '');
      opt.textContent = fmtDate(e.date) + '  ·  ' + e.sheet + issueMark;
      opt.addEventListener('click', function(){
        selectedIndex = i;
        updateDateSelectLabel();
        closeDateMenu();
        showReportForIndex(i);
      });
      dateSelectMenu.appendChild(opt);
    });
    selectedIndex = 0;
    updateDateSelectLabel();
    dateBar.classList.add('show');
  }

  function updateDateSelectLabel(){
    const entry = entries[selectedIndex];
    const issueMark = entry && entry.corrections && entry.corrections.length ? '  ⚠'
      : (entry && entry.warnings && entry.warnings.length ? '  ⚠' : '');
    dateSelectLabel.textContent = entry ? (fmtDate(entry.date) + '  ·  ' + entry.sheet + issueMark) : '—';
    const opts = dateSelectMenu.querySelectorAll('.cs-option');
    opts.forEach(function(o){
      o.classList.toggle('active', Number(o.dataset.index) === selectedIndex);
    });
  }

  dateSelectTrigger.addEventListener('click', function(e){
    e.stopPropagation();
    if(dateSelectWrap.classList.contains('open')) closeDateMenu();
    else openDateMenu();
  });
  document.addEventListener('click', function(e){
    if(!dateSelectWrap.contains(e.target)) closeDateMenu();
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') closeDateMenu();
  });

  // Shows exactly what was auto-corrected (and why) or merely flagged as
  // unusual for this entry, right above the receipt. Corrections and
  // warnings are rendered as two separate groups so it's clear which
  // numbers were actually changed vs. which were just left as a note.
  function renderIssues(entry){
    const corrections = entry.corrections || [];
    const warnings = entry.warnings || [];
    if(corrections.length === 0 && warnings.length === 0){
      issueBar.classList.remove('show');
      issueBar.innerHTML = '';
      return;
    }
    let html = '';
    if(corrections.length){
      html += '<div class="issue-group corrected">'
        + '<div class="issue-head">⚠ ชุดข้อมูลนี้ถูกแก้ไขอัตโนมัติ ('+corrections.length+' จุด)</div>'
        + corrections.map(function(c){ return '<div class="issue-line">'+esc(c)+'</div>'; }).join('')
        + '</div>';
    }
    if(warnings.length){
      html += '<div class="issue-group warn">'
        + '<div class="issue-head">สังเกต: ข้อมูลดูผิดปกติ ('+warnings.length+' จุด)</div>'
        + warnings.map(function(w){ return '<div class="issue-line">'+esc(w)+'</div>'; }).join('')
        + '</div>';
    }
    issueBar.innerHTML = html;
    issueBar.classList.add('show');
  }

  // Tells the person, once per file, which sheets in the workbook were
  // skipped because their columns don't match the report's expected
  // layout (e.g. a differently-structured comparison tab) — so a gap in
  // available dates isn't mistaken for missing data.
  function renderSheetNote(){
    // Month/date-mismatch notice disabled per request — the underlying
    // row-skip safety check in parseWorkbookFull still runs (rows whose
    // date doesn't fall in the month the sheet's own name says are still
    // excluded from entries/cumulative totals), it's just not surfaced
    // as a warning banner anymore. Only the structural "sheet skipped"
    // notice remains.
    const hasSkipped = skippedSheets && skippedSheets.length > 0;
    const hasDayIssues = dayCountIssues && dayCountIssues.length > 0;
    if(!hasSkipped && !hasDayIssues){
      sheetNote.classList.remove('show');
      sheetNote.innerHTML = '';
      return;
    }
    let html = '';
    if(hasSkipped){
      html += '<div>⚠ ข้ามชีตที่โครงสร้างคอลัมน์ไม่ตรงกับรายงาน (ไม่มีข้อมูล EOC): '
        + skippedSheets.map(esc).join(', ') + '</div>';
    }
    if(hasDayIssues){
      html += dayCountIssues.map(function(iss){
        const bits = ['พบ '+iss.found+' วัน (วันที่ '+iss.minDay+'–'+iss.maxDay+')'];
        if(iss.missing.length) bits.push('ขาดวันที่ '+iss.missing.join(', '));
        if(iss.duplicates.length) bits.push('วันที่ซ้ำ '+iss.duplicates.join(', '));
        return '<div>⚠ ชีต "'+esc(iss.sheet)+'": '+bits.join(' — ')+'</div>';
      }).join('');
    }
    sheetNote.innerHTML = html;
    sheetNote.classList.add('show');
  }

  function showReportForIndex(i){
    const entry = entries[i];
    rawText = renderReport(entry);
    receiptCard.innerHTML = buildReceiptHTML(entry);
    renderIssues(entry);
    outputEl.classList.add('show');
    copyBtn.textContent = 'Copy';
    copyBtn.classList.remove('done');
  }

  function handleFile(file){
    hideStatus();
    outputEl.classList.remove('show');
    dateBar.classList.remove('show');
    closeDateMenu();
    fileName.textContent = file.name;
    fileBar.classList.remove('show');
    void fileBar.offsetWidth; // restart entrance animation
    fileBar.classList.add('show');

    if(stampIcon){
      stampIcon.classList.remove('success');
      void stampIcon.offsetWidth;
      stampIcon.classList.add('success');
    }
    dropZone.classList.remove('pop');
    void dropZone.offsetWidth;
    dropZone.classList.add('pop');

    const reader = new FileReader();
    reader.onload = function(e){
      try{
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, {type:'array'});
        parseWorkbookFull(wb);
        if(entries.length === 0){
          showStatus('ไม่พบแถวข้อมูลยอดขายที่มีวันที่และตัวเลขปี 2026 ในไฟล์นี้');
          renderSheetNote();
          return;
        }
        addToHistory(file.name, data);
        populateDateSelect();
        renderSheetNote();
        showReportForIndex(0);
      }catch(err){
        showStatus('เกิดข้อผิดพลาดในการอ่านไฟล์: '+err.message);
      }
    };
    reader.onerror = function(){
      showStatus('ไม่สามารถอ่านไฟล์นี้ได้');
    };
    reader.readAsArrayBuffer(file);
  }

  fileInput.addEventListener('change', function(){
    if(fileInput.files && fileInput.files[0]) handleFile(fileInput.files[0]);
  });

  let dragCounter = 0;
  ['dragenter','dragover'].forEach(function(ev){
    dropZone.addEventListener(ev, function(e){
      e.preventDefault(); e.stopPropagation();
      if(ev === 'dragenter') dragCounter++;
      dropZone.classList.add('drag');
      if(dropTitle) dropTitle.textContent = 'ปล่อยไฟล์ตรงนี้ได้เลย';
    });
  });
  dropZone.addEventListener('dragleave', function(e){
    e.preventDefault(); e.stopPropagation();
    dragCounter = Math.max(0, dragCounter - 1);
    if(dragCounter === 0){
      dropZone.classList.remove('drag');
      if(dropTitle) dropTitle.textContent = dropTitleDefault;
    }
  });
  dropZone.addEventListener('drop', function(e){
    e.preventDefault(); e.stopPropagation();
    dragCounter = 0;
    dropZone.classList.remove('drag');
    if(dropTitle) dropTitle.textContent = dropTitleDefault;
    const f = e.dataTransfer.files && e.dataTransfer.files[0];
    if(f) handleFile(f);
  });

  clearBtn.addEventListener('click', function(){
    fileInput.value = '';
    fileBar.classList.remove('show');
    dateBar.classList.remove('show');
    outputEl.classList.remove('show');
    issueBar.classList.remove('show');
    issueBar.innerHTML = '';
    sheetNote.classList.remove('show');
    sheetNote.innerHTML = '';
    closeDateMenu();
    hideStatus();
    entries = [];
    skippedSheets = [];
    dateMismatches = [];
    dayCountIssues = [];
  });

  copyBtn.addEventListener('click', function(){
    navigator.clipboard.writeText(rawText).then(function(){
      copyBtn.textContent = 'Copied ✓';
      copyBtn.classList.add('done');
      setTimeout(function(){
        copyBtn.textContent = 'Copy';
        copyBtn.classList.remove('done');
      }, 1600);
    }).catch(function(){
      // fallback
      const ta = document.createElement('textarea');
      ta.value = rawText;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      copyBtn.textContent = 'Copied ✓';
      copyBtn.classList.add('done');
    });
  });
})();
</script>
